services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Em produção, evite bind-mount do projeto (.-/app). Mantive apenas volumes de persistência.
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/mediafiles
    command: >
      sh -c "python3 manage.py migrate &&
             python3 manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8020 --proxy-headers -t 300 --websocket_timeout 300 core.asgi:application"
    restart: always
    ports:
      - "8020:8020"
    depends_on:
      - redis
    networks:
      - mynetwork

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6386:6379"
    networks:
      - mynetwork

networks:
  mynetwork:

volumes:
  staticfiles:
  mediafiles:
